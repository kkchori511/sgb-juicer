name: Update swap test

on:
  workflow_dispatch:
  push:
    branches:
      - 'ci/**'

permissions:
  contents: read

jobs:
  swap:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: v0.1.0 → v0.1.1 교체 시험
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/update_swap_check.py v0.1.0 v0.1.1
