name: Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/**'
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Backend tests
        run: |
          python tests/test_backend.py
          python tests/test_records.py
          python tests/test_inbox.py
          python tests/test_scan.py
          python tests/test_standards.py
          python tests/test_move_batch.py
          python tests/test_review_fixes.py
          python tests/test_recheck_fixes.py
          python tests/test_roster_input.py
          python tests/test_existing_import.py
          python tests/test_pair_subject.py
          python tests/test_stdformat.py
          python tests/test_tag_view.py
          python tests/test_basis_gen.py
          python tests/test_close_bulk.py
          python tests/test_fill_tidy.py
          python tests/test_update_download.py
          python tests/test_ai_cancel.py
          python tests/test_config_safe.py
          python tests/test_migrate_v12.py
          python tests/test_tagwork.py
          python tests/test_tagwork_edges.py
          python tests/test_inbox_columns.py

      - name: Version info
        shell: pwsh
        run: |
          $ver = python packaging/make_version_info.py
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$ver") {
            Write-Error "태그($env:GITHUB_REF_NAME)와 앱 버전(v$ver)이 다릅니다."; exit 1
          }

      - name: Build executable
        run: pyinstaller packaging/sgb.spec

      - name: Smoke test executable
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/생기부착즙기.exe" -ArgumentList "--selftest","selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { Write-Error "exe 자체 시험 실패"; exit 1 }

      - name: Update swap test (rename running exe, relaunch, cleanup)
        shell: pwsh
        run: |
          $w = Join-Path $pwd "swaptest"
          New-Item -ItemType Directory -Force $w | Out-Null
          $exe = Join-Path $w "생기부착즙기.exe"
          $new = "$exe.new"
          $out = Join-Path $w "swap.txt"
          Copy-Item "dist/생기부착즙기.exe" $exe
          Copy-Item "dist/생기부착즙기.exe" $new
          "stale" | Set-Content (Join-Path $w "생기부착즙기.exe.old")
          $p = Start-Process -FilePath $exe -ArgumentList "--selftest-swap", "`"$new`"", "`"$out`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content $out -ErrorAction SilentlyContinue; Write-Error "교체 실패"; exit 1 }
          for ($i = 0; $i -lt 120 -and -not (Test-Path $out); $i++) { Start-Sleep -Milliseconds 500 }
          Start-Sleep -Seconds 2
          Get-Content $out
          Get-ChildItem $w | Format-Table Name, Length
          $txt = Get-Content $out -Raw
          if ($txt -notmatch "pdfium OK" -or $txt -notmatch "lock OK" -or $txt -notmatch "leftovers cleaned: .*\.old") { Write-Error "새 exe 실행·잠금·정리 실패"; exit 1 }
          if (Test-Path $new) { Write-Error ".new가 남음"; exit 1 }
          if (Get-ChildItem $w -Filter "*.old") { Write-Error ".old가 남음"; exit 1 }
          if (-not (Test-Path $exe)) { Write-Error "exe가 없음"; exit 1 }

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: sgb-juicer-windows
          path: dist/생기부착즙기.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download executable
        uses: actions/download-artifact@v4
        with:
          name: sgb-juicer-windows
          path: dist

      - name: Attach executable to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # 자산 이름은 ASCII(한글 파일명은 GitHub에서 바뀔 수 있음), 표시 이름은 한글
          Copy-Item "dist/생기부착즙기.exe" "dist/SGB-Juicer.exe"
          gh release view "$env:RELEASE_TAG" --repo "$env:GH_REPO"
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:RELEASE_TAG" --repo "$env:GH_REPO" --title "생기부 착즙기 $env:RELEASE_TAG (베타)" --generate-notes --verify-tag
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload "$env:RELEASE_TAG" "dist/SGB-Juicer.exe#생기부착즙기.exe" --repo "$env:GH_REPO" --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  mirror:
    # 예비 경로: 일부 학교·통신사 망은 release-assets.githubusercontent.com을 막는다.
    # 같은 exe를 gh-pages 브랜치(GitHub Pages)에 최신 1개만 올린다(기록을 매번 덮어써 저장소가 커지지 않게).
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download executable
        uses: actions/download-artifact@v4
        with:
          name: sgb-juicer-windows
          path: dist

      - name: Publish to gh-pages
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          set -e
          ver="${TAG#v}"
          mkdir site && cd site
          cp "../dist/생기부착즙기.exe" "SGB-Juicer-$ver.exe"
          touch .nojekyll
          echo "<!doctype html><meta charset=utf-8><title>생기부 착즙기</title><p>생기부 착즙기 v$ver 예비 내려받기: <a href=\"SGB-Juicer-$ver.exe\">SGB-Juicer-$ver.exe</a></p>" > index.html
          sha256sum "SGB-Juicer-$ver.exe"
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "mirror $TAG"
          git push -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" gh-pages
