<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'none'; script-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>생기부 착즙기</title>
<style>

*{box-sizing:border-box}html,body{margin:0;min-height:100%;}body{min-height:100vh;display:grid;place-items:center;background:#eaf0f5;color:#263b4b;font-family:"Segoe UI","Malgun Gothic",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.splash{position:relative;width:min(420px,100vw);height:420px;overflow:hidden;border:1px solid #dce5eb;border-radius:28px;background:#fff;box-shadow:0 16px 48px #31495c12;text-align:center;padding:20px 30px;display:flex;flex-direction:column;justify-content:center}
.art{display:block;width:100%;height:230px;min-height:0;flex:0 1 230px;overflow:visible}h1{flex:none;margin:9px 0 8px;font-size:26px;letter-spacing:-1.1px;font-weight:700;line-height:1.4}.loading{flex:none;margin:0;color:#617583;font-size:13px;line-height:22px}.version{display:block;flex:none;line-height:16px;color:#85939d;font-size:11px;letter-spacing:.8px;margin-top:14px;font-variant-numeric:tabular-nums}.dots{display:inline-flex;gap:3px;margin-left:4px;vertical-align:middle}.dots i{display:block;width:3px;height:3px;background:currentColor;border-radius:50%;animation:dot 2.1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
.orange{transform-box:fill-box;transform-origin:50% 35%;animation:squeeze var(--cycle) ease-in-out infinite}.hand-motion{transform-box:view-box;transform-origin:238px 49px;animation:grip var(--cycle) ease-in-out infinite}.bead{transform-box:fill-box;transform-origin:50% 0;animation:bead var(--cycle) ease-in-out infinite}.drop{opacity:0;animation:fall var(--cycle) cubic-bezier(.35,0,.75,.55) infinite}.d2{animation-delay:var(--delay2)}.d3{animation-delay:var(--delay3)}
@keyframes squeeze{0%,5%,37%,42%,78%,100%{transform:scale(1)}12%,25%,50%,63%{transform:scale(.89,1.045)}}@keyframes grip{0%,5%,37%,42%,78%,100%{transform:translate(0,0) rotate(0) scale(1,1)}12%,25%,50%,63%{transform:translate(-1px,2px) rotate(-1deg) scale(.955,1.015)}}@keyframes bead{0%,5%,37%,42%,78%,100%{transform:scale(.65)}12%,25%,50%,63%{transform:scale(1.15)}}@keyframes fall{0%,11%,37%,49%,75%,100%{opacity:0;transform:translateY(-4px) scale(.55)}14%,52%{opacity:1;transform:translateY(0) scale(.55)}29%,67%{opacity:1;transform:translateY(45px) scale(.85)}33%,71%{opacity:0;transform:translateY(55px) scale(.85)}}@keyframes dot{0%,65%,100%{opacity:.3}30%{opacity:1}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.drop{opacity:0}.drop.d1{opacity:1;transform:translateY(20px) scale(.8)}.dots i{opacity:.65}.pool{transform:scaleY(.65)!important}.ripple{opacity:0!important}}
@media(max-width:359px){.splash{padding-left:18px;padding-right:18px}h1{font-size:24px}}

.splash{--cycle:3.2s;--delay2:.12s;--delay3:.24s}
.splash{background:#f6f9fc}.art{height:230px}h1{color:#2c455a}

/* 420×420 창 안에서 그림과 글자를 세로 중앙 정렬한다. 그림만 줄어들 수 있다. */
body{background:#f6f9fc;overflow:hidden}.splash{width:100vw;height:100vh;border:0;border-radius:0;box-shadow:none}
</style>
</head>
<body>
<!-- 인트로 손 다듬기 시안 1. 원본과 같은 420×420 창에서 확인. -->

<g class="hand-motion" fill="#f3cfac" stroke="#bd8c69" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
<path stroke="none" d="M217 31 C192 51 178 55 147 51 C123 47 106 50 96 61 C84 74 80 94 78 115 C76 139 81 160 96 173 C104 180 114 179 121 171 L175 121 L193 158 C207 146 213 125 224 105 L247 53 C242 43 230 34 217 31Z"/>

<!-- 손가락 뿌리는 손바닥에 겹치며, 뿌리의 경계선은 그리지 않는다. -->
<g class="hand-motion" fill="#f3cfac" stroke="#bd8c69" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">

<!-- 손등·검지·엄지는 하나의 면. 엄지 끝을 둥글게 닫는다. -->

<path fill="none" d="M247 53 C242 43 230 34 217 31 C192 51 178 55 147 51 C123 47 106 50 96 61 C88 70 86 79 91 87 C96 98 109 102 116 94 C122 87 117 78 112 74"/>
<path fill="none" d="M177 69 C163 76 149 84 144 94 C138 106 147 115 159 112 C169 110 178 102 188 101 C198 100 202 105 208 109"/>
<!-- 짧은 곡선으로 관절을 표시하고 손목에는 사선 이음매를 만들지 않는다. -->
<path d="M104 76 Q111 81 110 88 M93 113 Q88 117 90 123 M96 139 Q92 143 94 149 M105 163 Q101 168 104 173" fill="none" stroke="#d9a77e" stroke-width="1.8"/>
</g><path d="M145 192 C139 200 142 207 148 207 C155 207 158 200 150 192Z" class="bead" fill="#edb942" stroke="#d79a32" stroke-width="1.5"/><g transform="translate(148 199)"><g class="drop d1"><path d="M0 0 C-3 6-7 11-7 15 A7 7 0 0 0 7 15 C7 11 3 6 0 0Z" fill="#edb942" stroke="#d69a2e" stroke-width="1.5"/><path d="M-2 9 Q-5 13-4 15" fill="none" stroke="#fff4cf" stroke-width="2.5" stroke-linecap="round"/></g><g class="drop d2"><path d="M0 0 C-3 6-7 11-7 15 A7 7 0 0 0 7 15 C7 11 3 6 0 0Z" fill="#edb942" stroke="#d69a2e" stroke-width="1.5"/><path d="M-2 9 Q-5 13-4 15" fill="none" stroke="#fff4cf" stroke-width="2.5" stroke-linecap="round"/></g><g class="drop d3"><path d="M0 0 C-3 6-7 11-7 15 A7 7 0 0 0 7 15 C7 11 3 6 0 0Z" fill="#edb942" stroke="#d69a2e" stroke-width="1.5"/><path d="M-2 9 Q-5 13-4 15" fill="none" stroke="#fff4cf" stroke-width="2.5" stroke-linecap="round"/></g></g>
</svg>
<h1 id="app-name">생기부 착즙기</h1>
<p class="loading" role="status"><span>불러오는 중<span class="sr-only">…</span></span><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span></p>

</main>

</body>
</html>
