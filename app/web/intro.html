<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'none'; script-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>생기부 착즙기</title>
<style>

*{box-sizing:border-box}html,body{margin:0;min-height:100%;}body{min-height:100vh;display:grid;place-items:center;background:#eaf0f5;color:#263b4b;font-family:"Segoe UI","Malgun Gothic",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.splash{position:relative;width:min(420px,100vw);height:420px;overflow:hidden;border:1px solid #dce5eb;border-radius:28px;background:#fff;box-shadow:0 16px 48px #31495c12;text-align:center;padding:24px 30px}
.art{display:block;width:100%;height:250px;overflow:visible}h1{margin:9px 0 8px;font-size:26px;letter-spacing:-1.1px;font-weight:700;line-height:1.4}.loading{margin:0;color:#617583;font-size:13px;line-height:22px}.version{display:block;color:#85939d;font-size:11px;letter-spacing:.8px;margin-top:14px;font-variant-numeric:tabular-nums}.dots{display:inline-flex;gap:3px;margin-left:4px;vertical-align:middle}.dots i{display:block;width:3px;height:3px;background:currentColor;border-radius:50%;animation:dot 2.1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
.orange{transform-box:fill-box;transform-origin:50% 35%;animation:squeeze var(--cycle) ease-in-out infinite}.thumb{transform-box:fill-box;transform-origin:85% 20%;animation:thumb var(--cycle) ease-in-out infinite}.finger{animation:finger var(--cycle) ease-in-out infinite}.f2{animation-delay:.035s}.f3{animation-delay:.07s}.f4{animation-delay:.1s}.bead{transform-box:fill-box;transform-origin:50% 0;animation:bead var(--cycle) ease-in-out infinite}.drop{opacity:0;animation:fall var(--cycle) cubic-bezier(.35,0,.75,.55) infinite}.d2{animation-delay:var(--delay2)}.d3{animation-delay:var(--delay3)}
@keyframes squeeze{0%,12%,87%,100%{transform:scale(1)}30%,66%{transform:scale(.89,1.045)}}@keyframes thumb{0%,12%,87%,100%{transform:rotate(0)}30%,66%{transform:translate(-3px,5px) rotate(-5deg)}}@keyframes finger{0%,12%,87%,100%{transform:translateX(0)}30%,66%{transform:translateX(6px)}}@keyframes bead{0%,12%,87%,100%{transform:scale(.65)}30%,66%{transform:scale(1.15)}}@keyframes fall{0%,26%{opacity:0;transform:translateY(-4px) scale(.55)}29%{opacity:1}48%{opacity:1;transform:translateY(45px) scale(.85)}54%,100%{opacity:0;transform:translateY(55px) scale(.85)}}@keyframes dot{0%,65%,100%{opacity:.3}30%{opacity:1}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.drop{opacity:0}.drop.d1{opacity:1;transform:translateY(20px) scale(.8)}.dots i{opacity:.65}.pool{transform:scaleY(.65)!important}.ripple{opacity:0!important}}
@media(max-width:359px){.splash{padding-left:18px;padding-right:18px}h1{font-size:24px}}

.splash{--cycle:2.1s;--delay2:.27s;--delay3:.54s}
.splash{background:#f6f9fc}.art{height:250px}h1{color:#2c455a}

/* 앱 인트로 창: 창을 꽉 채움 */
body{background:#f6f9fc;overflow:hidden}.splash{width:100vw;height:100vh;border:0;border-radius:0;box-shadow:none}
</style>
</head>
<body>

</svg>

<p class="loading" role="status"><span>불러오는 중<span class="sr-only">…</span></span><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span></p>
